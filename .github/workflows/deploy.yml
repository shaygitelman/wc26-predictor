name: Deploy to Vercel

# Replaces the Vercel GitHub integration (which stopped triggering after a
# failed build). This workflow deploys every push to main using the CLI so
# production is always up to date.

on:
  push:
    branches: [main]
  workflow_dispatch:    # allow manual deploy from Actions tab

concurrency:
  group: vercel-deploy
  cancel-in-progress: true   # cancel queued deploy if a newer commit arrives

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

    env:
      VERCEL_ORG_ID:     team_BfDepKyAtDeKACeMm7C0wosf
      VERCEL_PROJECT_ID: prj_rTuqgkLxVeHQEAqp22jK4Y1ui4QC
