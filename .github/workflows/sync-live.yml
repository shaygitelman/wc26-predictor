name: Live Match Sync — Manual Debug

# ─────────────────────────────────────────────────────────────────────────────
# Automatic live sync is handled by cron-job.org (every 1 minute).
# Target: https://wc26-predictor-xi.vercel.app/api/cron/live-cycle
# Header: X-Cron-Secret: <CRON_SECRET>
#
# This workflow is for manual debugging only.
# It calls the same /api/cron/live-cycle endpoint so results are identical.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you triggering this run?'
        required: false
        default: 'manual debug'

concurrency:
  group: live-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Call live-cycle
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Run info
        run: |
          echo "╔═════════════════════════════════════════╗"
          echo "║   Live Match Sync — Manual Debug Run    ║"
          echo "╚═════════════════════════════════════════╝"
          echo ""
          echo "  Trigger  : workflow_dispatch"
          echo "  Reason   : ${{ github.event.inputs.reason }}"
          echo "  Actor    : ${{ github.actor }}"
          echo "  Time     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  Commit   : ${{ github.sha }}"
          echo ""
          echo "  cron-job.org → same endpoint every minute in production"
          echo ""

      - name: Call /api/cron/live-cycle
        id: cycle
        run: |
          APP_URL="${{ vars.APP_URL }}"
          if [ -z "${APP_URL}" ]; then
            echo "ERROR: APP_URL is not set — add it in Settings → Variables → Repository variables"
            exit 1
          fi

          ENDPOINT="${APP_URL}/api/cron/live-cycle"
          echo "Endpoint : ${ENDPOINT}"
          echo "Time     : $(date -u '+%H:%M:%S UTC')"
          echo ""

          HTTP_STATUS=$(curl -s \
            --max-time 90 \
            --retry 0 \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -o /tmp/cycle.json \
            -w "%{http_code}" \
            "${ENDPOINT}") || HTTP_STATUS="000"

          echo "HTTP status : ${HTTP_STATUS}"
          echo ""

          if [ "${HTTP_STATUS}" = "000" ]; then
            echo "ERROR: Network error or timeout — is APP_URL reachable?"
            exit 1
          fi
          if [ "${HTTP_STATUS}" = "401" ] || [ "${HTTP_STATUS}" = "403" ]; then
            echo "ERROR: Auth failed (${HTTP_STATUS})"
            echo "Verify CRON_SECRET in GitHub Secrets matches the CRON_SECRET env var in Vercel."
            cat /tmp/cycle.json 2>/dev/null || true
            exit 1
          fi
          if [ "${HTTP_STATUS}" -ge 400 ] 2>/dev/null; then
            echo "ERROR: HTTP ${HTTP_STATUS}"
            cat /tmp/cycle.json 2>/dev/null || true
            exit 1
          fi

          echo "=== Full Response ==="
          python3 -c "import json; print(json.dumps(json.load(open('/tmp/cycle.json')), indent=2))" 2>/dev/null \
            || cat /tmp/cycle.json 2>/dev/null \
            || echo "(no body)"

          echo ""
          echo "=== Summary ==="
          if [ -f /tmp/cycle.json ]; then
            jq -r '"  Timestamp   : " + (.timestamp // "?")' /tmp/cycle.json 2>/dev/null || true
            jq -r '"  Elapsed     : " + ((.elapsed_ms // 0)|tostring) + " ms"' /tmp/cycle.json 2>/dev/null || true
            jq -r '"  Polling     : " + (.polling_mode // "?")' /tmp/cycle.json 2>/dev/null || true
            jq -r '"  API calls   : " + ((.api_calls_today // 0)|tostring)' /tmp/cycle.json 2>/dev/null || true
            jq -r '"  Reconcile   : " + (.reconcile.status // "?") + "  affected=" + ((.reconcile.records_affected // 0)|tostring)' /tmp/cycle.json 2>/dev/null || true
            jq -r '"  Sync-live   : " + (.sync.status // "?") + "  updated=" + ((.sync.matches_updated // 0)|tostring)' /tmp/cycle.json 2>/dev/null || true
            jq -r '"  Context     : " + (.update_context // "(none)")' /tmp/cycle.json 2>/dev/null || true
            jq -r 'if (.live_matches | length) > 0 then "  Live matches: " + ((.live_matches | length)|tostring) else "  Live matches: 0" end' /tmp/cycle.json 2>/dev/null || true
            jq -r '.backend_errors // [] | if length > 0 then "  Backend errs: " + tostring else empty end' /tmp/cycle.json 2>/dev/null || true
          fi
